- auto_generated_guid: 96db2632-8417-4dbb-b8bb-a8b92ba391de
  description: 'Identify remote systems via ping sweep.


    Upon successful execution, sh will perform a ping sweep on the 192.168.1.1/24
    and echo via stdout if an IP is active.

    '
  executor:
    command: 'for ip in $(seq #{start_host} #{stop_host}); do ping -c 1 #{subnet}.$ip;
      [ $? -eq 0 ] && echo "#{subnet}.$ip UP" || : ; done

      '
    name: sh
  input_arguments:
    start_host:
      default: '1'
      description: Subnet used for ping sweep.
      type: string
    stop_host:
      default: '254'
      description: Subnet used for ping sweep.
      type: string
    subnet:
      default: 192.168.1
      description: Subnet used for ping sweep.
      type: string
  name: Remote System Discovery - sweep
  supported_platforms:
  - linux
  - macos
- auto_generated_guid: baa01aaa-5e13-45ec-8a0d-e46c93c9760f
  description: 'Powershell script that runs nslookup on cmd.exe against the local
    /24 network of the first network adaptor listed in ipconfig.


    Upon successful execution, powershell will identify the ip range (via ipconfig)
    and perform a for loop and execute nslookup against that IP range. Output will
    be via stdout.

    '
  executor:
    command: '$localip = ((ipconfig | findstr [0-9].\.)[0]).Split()[-1]

      $pieces = $localip.split(".")

      $firstOctet = $pieces[0]

      $secondOctet = $pieces[1]

      $thirdOctet = $pieces[2]

      foreach ($ip in 1..255 | % { "$firstOctet.$secondOctet.$thirdOctet.$_" } ) {cmd.exe
      /c nslookup $ip}

      '
    elevation_required: true
    name: powershell
  name: Remote System Discovery - nslookup
  supported_platforms:
  - windows
