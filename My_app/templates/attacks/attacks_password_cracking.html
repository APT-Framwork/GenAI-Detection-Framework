{% extends 'attacks.html' %}

{% block attack %}
<br><br><br>
<div style="display:flex; margin: 0 auto; width: 50vw; justify-content: center;flex-direction: column;align-items: center;">
    <br><br><br>
    <div class="box" style="width: 60vw">
    <br><br>

<h2 class="subtitle is-2">Password cracking</h2>
<form action="" method="POST">
    {% csrf_token %}

    <div class="field">
        <label class="label">Activity name</label>
        <div class="control">
            {{ form.password_cracking_name }}
        </div>
    </div>

    <div class="field">
        <label class="label">Wordlist path</label>
        <div class="control">
            {{ form.wordlist_path }}
        </div>
    </div>

    <div class="field">
        <label class="label">Hash type</label>
        <div class="select">
            {{ form.hash_type }}
        </div>
    </div>

    <div class="field">
        <label class="label">Hash value</label>
        <div class="control">
            {{ form.hash_value }}
        </div>
    </div>

    <div class="field">
        <label class="label">Hash</label>
        <div class="select">
            {{ form.hash_choices }}
        </div>
    </div>

    <br><br>
    <div class="field">
        <div class="control">
            Import from database {{ form.checkbox }}
        </div>
    </div>

    <div style="display: flex; justify-content: flex-end;">
    <input class="button is-dark" type="submit" value="Start">
    </div>

</form>
</div>
</div>

<script>

    window.addEventListener('load', function() {
        toggleInputs();  // Appeler la fonction pour activer/désactiver les champs selon l'état initial de la case à cocher
    });

    function toggleInputs() {
    var checkbox = document.getElementById("id_checkbox");
    var hash_value = document.getElementById("id_hash_value");
    var hash_type = document.getElementById("id_hash_type");
    var hash_choices = document.getElementById("id_hash_choices");


    if (checkbox.checked) {
      hash_choices.disabled = false;  // Activer le champ
      hash_value.disabled = true; // Déactiver le champ
      hash_type.disabled = true; //Déactiver le champ
    } else {
      hash_choices.disabled = true;  // Désactiver le champ
      hash_value.disabled = false; // Activer le champ
      hash_type.disabled = false; // Activer le champ
     }
    }


</script>

{% endblock %}
