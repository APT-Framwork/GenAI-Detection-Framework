- auto_generated_guid: 562427b4-39ef-4e8c-af88-463a78e70b9c
  description: 'This test uses PowerShell to create a Hollow from a PE on disk with
    explorer as the parent.

    Credit to FuzzySecurity (https://github.com/FuzzySecurity/PowerShell-Suite/blob/master/Start-Hollow.ps1)

    '
  executor:
    cleanup_command: 'Stop-Process -Name "#{spawnto_process_name}" -ErrorAction Ignore

      '
    command: '. #{start_hollow_script_path}

      $ppid=Get-Process #{parent_process_name} | select -expand id

      Start-Hollow -Sponsor "#{sponsor_binary_path}" -Hollow "#{hollow_binary_path}"
      -ParentPID $ppid -Verbose

      '
    name: powershell
  input_arguments:
    hollow_binary_path:
      default: C:\Windows\System32\cmd.exe
      description: Path of the binary to hollow (executable that will run inside the
        sponsor)
      type: string
    parent_process_name:
      default: explorer
      description: Name of the parent process
      type: string
    spawnto_process_name:
      default: notepad
      description: Name of the process to spawn
      type: string
    sponsor_binary_path:
      default: C:\Windows\System32\notepad.exe
      description: Path of the sponsor binary (executable that will host the binary)
      type: string
    start_hollow_script_path:
      default: C:\Users\anis\Desktop\Start-Hollow.ps1
      description: start_hollow path
      type: path
  name: Process Hollowing using PowerShell
  supported_platforms:
  - windows
