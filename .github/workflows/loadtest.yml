name: loadtest

on:
  schedule:
    # Nightly at 02:30 UTC. Catches latency regressions without blocking PRs.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "API base URL (default: built-in compose)"
        required: false
        default: ""

jobs:
  k6-dashboard:
    name: k6 dashboard load test (§7.1)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_DB: strix
          POSTGRES_USER: strix
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }

      - name: install api
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: alembic upgrade head
        working-directory: apps/api
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_PASSWORD: test
        run: alembic upgrade head

      - name: start API in the background
        working-directory: apps/api
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_PASSWORD: test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          AUTH_DEV_SKIP_AUTH: "true"
          AUTH_JWT_SECRET: "ci-secret"
          ENV: "dev"
        run: |
          uvicorn strix_api.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 20); do
            curl -fs http://localhost:8000/health && exit 0 || sleep 1
          done
          echo "API failed to come up" >&2
          exit 1

      - name: install k6
        run: |
          curl -fsSL https://github.com/grafana/k6/releases/download/v0.55.0/k6-v0.55.0-linux-amd64.tar.gz \
            | tar -xz -C /tmp
          sudo mv /tmp/k6-v0.55.0-linux-amd64/k6 /usr/local/bin/k6

      - name: run dashboard load test
        env:
          STRIX_API_BASE: http://localhost:8000/api/v1
        run: k6 run --summary-export=loadtest.json infra/loadtests/api_smoke.js

      - uses: actions/upload-artifact@v4
        with:
          name: loadtest-summary
          path: loadtest.json
