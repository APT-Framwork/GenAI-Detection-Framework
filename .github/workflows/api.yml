name: api

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "infra/scripts/dump_openapi.py"
      - ".github/workflows/api.yml"
  push:
    branches: [main, Platforme]
    paths:
      - "apps/api/**"
      - "infra/scripts/dump_openapi.py"
      - ".github/workflows/api.yml"
  workflow_dispatch:

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/api

jobs:
  # --------------------------------------------------------------- lint + type
  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff check
        run: ruff check src tests
      - name: ruff format --check
        run: ruff format --check src tests
      - name: mypy --strict
        # Aspirational — mypy --strict on a codebase that uses lots of
        # dynamically-typed libraries (httpx, sqlalchemy text(),
        # transformers, etc.) currently surfaces ~80 advisory errors.
        # Surfaces in the run summary; doesn't gate CI until we either
        # add stubs everywhere or relax to non-strict in pyproject.
        continue-on-error: true
        run: mypy src

  # --------------------------------------------------------------- unit tests
  unit:
    name: unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest
        env:
          DB_PASSWORD: test
        run: |
          pytest \
            --cov=strix_api \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=55 \
            tests/unit
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: apps/api/coverage.xml
          if-no-files-found: warn

  # --------------------------------------------------------------- integration
  # Runs Postgres + Redis as service containers; only executes when integration
  # tests exist under tests/integration (Phase 1+). Harmless no-op on Phase 0.
  integration:
    name: integration tests (postgres + redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_DB: strix
          POSTGRES_USER: strix
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Skip if no integration tests yet
        id: guard
        run: |
          if [ -z "$(find tests/integration -name 'test_*.py' 2>/dev/null)" ]; then
            echo "present=false" >> $GITHUB_OUTPUT
          else
            echo "present=true" >> $GITHUB_OUTPUT
          fi
      - name: Alembic upgrade head
        if: steps.guard.outputs.present == 'true'
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_PASSWORD: test
        run: alembic upgrade head
      - name: pytest (integration)
        if: steps.guard.outputs.present == 'true'
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_PASSWORD: test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: pytest -m integration tests/integration

  # --------------------------------------------------------------- migration check
  migration-check:
    name: alembic migration round-trip
    runs-on: ubuntu-latest
    # Drift between SQLAlchemy models and Alembic migrations is a quality
    # signal worth surfacing in logs, but it shouldn't block the rest of
    # CI for a lab/PoC project. Flip back to false once the schema is
    # frozen + a fresh consolidated migration is squashed.
    continue-on-error: true
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_DB: strix
          POSTGRES_USER: strix
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: upgrade head, then downgrade base, then upgrade head
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_PASSWORD: test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: autogenerate diff should be empty
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_PASSWORD: test
        run: |
          # Alembic refuses '-' in --rev-id (must be a Python identifier).
          alembic revision --autogenerate -m "ci_drift" --rev-id ci_drift
          diff=$(grep -E "op\.(create|drop|alter)_(table|column|index|constraint)" \
            alembic/versions/ci_drift_ci_drift.py || true)
          # Emit a warning (not error) so the job still passes. Drift is a
          # quality signal worth surfacing in the run summary; gating CI on
          # it is too aggressive while the schema is still moving.
          if [ -n "$diff" ]; then
            echo "::warning::ORM models drift from Alembic migrations:"
            echo "$diff"
          fi

  # --------------------------------------------------------------- docker build
  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build api image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: false
          tags: strix/api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
